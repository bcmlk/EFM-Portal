            icons: { [kebabName]: window.lucide.icons[name] },
            nameAttr: 'data-lucide'

      const getTicketSlaStatus = (ticket) => {
        if (ticket.status === 'Resolved') return { label: 'Resolved', color: 'bg-emerald-900/40 text-emerald-300 border-emerald-700' };
        const created = new Date(ticket.createdAt).getTime();
        const now = Date.now();
        const elapsedHours = (now - created) / (1000 * 60 * 60);
        const remainingHours = ticket.slaTargetHours - elapsedHours;

        if (remainingHours <= 0) {
          return { label: 'SLA Breached', color: 'bg-rose-900/60 text-rose-200 border-rose-500 animate-pulse', isBreached: true, hoursLeft: 0 };
        } else if (remainingHours <= 2) {
          return { label: `SLA Warning (${remainingHours.toFixed(1)}h left)`, color: 'bg-amber-900/60 text-amber-200 border-amber-600', isBreached: false, hoursLeft: remainingHours };

          return { label: `Within SLA (${remainingHours.toFixed(1)}h left)`, color: 'bg-sky-900/50 text-sky-200 border-sky-600', isBreached: false, hoursLeft: remainingHours };
        }
      };

      const currentTenantLease = useMemo(() => {
        return leases.find(l => l.tenantId === activeTenantId) || leases[0];
      }, [leases, activeTenantId]);

      const currentTenantUnit = useMemo(() => {
        if (!currentTenantLease) return null;
        return units.find(u => u.id === currentTenantLease.unitId);
      }, [units, currentTenantLease]);

        if (!currentTenantUnit) return [];
        return reactiveTickets.filter(t => t.unitId === currentTenantUnit.id);
      }, [reactiveTickets, currentTenantUnit]);

      const handleUpdateTicketStatus = (ticketId, newStatus, workNotes, addPartsCost, addLaborCost) => {

          if (t.id === ticketId) {

              ...t,
              status: newStatus,
              notes: workNotes || t.notes,
              partsCostBHD: (t.partsCostBHD || 0) + (parseFloat(addPartsCost) || 0),
              laborCostBHD: (t.laborCostBHD || 0) + (parseFloat(addLaborCost) || 0)
            };

          return t;

      };

      const handleRecordPayment = (leaseId, amount) => {
        setLeases(prev => prev.map(l => {
          if (l.id === leaseId) {

            const newReceipt = {

              amount: parseFloat(amount),
              period: 'Current Month Rent',
              method: 'BenefitPay (Online)',
              receiptNo: `REC-BHD-${Math.floor(1000 + Math.random() * 9000)}`

            return {

              rentOutstanding: newOutstanding,
              paymentHistory: [newReceipt, ...l.paymentHistory]

          unitId: newInviteUnitId,
          propertyName: selectedUnit ? selectedUnit.propertyName : 'Property',

          {/* MODAL: GENERATE INVITATION TOKEN                          */}
          {/* ======================================================== */}
          {isInviteModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-sm">Generate Tenant Invitation Token</h3>
                  <button onClick={() => setIsInviteModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleGenerateInvite} className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Select Target Unit</label>
                    <select
                      value={newInviteUnitId}
                      onChange={(e) => setNewInviteUnitId(e.target.value)}
                      required
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none"
                    >
                      <option value="">-- Choose Unit --</option>
                      {units.map(u => (
                        <option key={u.id} value={u.id}>{u.propertyName} - Unit {u.unitNumber}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-medium text-slate-300 block mb-1">Tenant Email Address</label>
                    <input
                      type="email"
                      required
                      value={newInviteEmail}
                      onChange={(e) => setNewInviteEmail(e.target.value)}
                      placeholder="tenant@domain.bh"
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none"
                    />
                  </div>

                  {inviteGeneratedLink && (
                    <div className="p-3 bg-slate-950 rounded-xl border border-emerald-500/30 text-xs space-y-2">
                      <span className="text-emerald-400 font-semibold block">Generated Link:</span>
                      <p className="font-mono text-[11px] text-slate-300 break-all">{inviteGeneratedLink}</p>
                    </div>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsInviteModalOpen(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl hover:bg-slate-700"
                    >
                      Close
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl"
                    >
                      Generate Token
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: CREATE MAINTENANCE TICKET                          */}
          {/* ======================================================== */}
          {isAddTicketModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-sm">Raise Maintenance Request</h3>
                  <button onClick={() => setIsAddTicketModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const newTicket = {
                      id: `TICK-${Math.floor(100 + Math.random() * 900)}`,
                      unitId: form.unit.value,
                      unitName: units.find(u => u.id === form.unit.value)?.unitNumber || 'Unit',
                      tenantName: 'Submitted User',
                      title: form.title.value,
                      category: form.category.value,
                      priority: form.priority.value,
                      slaTargetHours: form.priority.value === 'Emergency' ? 4 : form.priority.value === 'High' ? 24 : 48,
                      createdAt: new Date().toISOString(),
                      status: 'Pending Tech',
                      assignedTo: 'Dispatch Tech Pool',
                      description: form.description.value,
                      notes: '',
                      partsCostBHD: 0,
                      laborCostBHD: 0
                    };
                    setReactiveTickets([newTicket, ...reactiveTickets]);
                    setIsAddTicketModalOpen(false);
                    triggerToast('Maintenance ticket raised and SLA timer initialized!');
                  }}
                  className="space-y-3 text-xs"
                >
                  <div>
                    <label className="text-slate-300 block mb-1">Select Property / Unit</label>
                    <select name="unit" required className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                      {units.map(u => (
                        <option key={u.id} value={u.id}>{u.propertyName} - {u.unitNumber}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 block mb-1">Category</label>
                      <select name="category" required className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                        <option value="HVAC / Air Conditioning">HVAC / Air Conditioning</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Civil / Painting">Civil / Painting</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">SLA Priority</label>
                      <select name="priority" required className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                        <option value="Emergency">Emergency (4h SLA)</option>
                        <option value="High">High (24h SLA)</option>
                        <option value="Medium">Medium (48h SLA)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1">Issue Summary</label>
                    <input name="title" required placeholder="Short title..." className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1">Detailed Description</label>
                    <textarea name="description" rows={3} required placeholder="Describe problem in detail..." className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsAddTicketModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">Submit Ticket</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: ADD NEW PROPERTY                                  */}
          {/* ======================================================== */}
          {isAddPropertyModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-sm">Add New Property to Portfolio</h3>
                  <button onClick={() => setIsAddPropertyModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleAddProperty} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1">Property Name</label>
                    <input name="propName" required placeholder="e.g. Reef Island Heights" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Property Type</label>
                    <input name="propType" required placeholder="e.g. Commercial & Residential Tower" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Location / Area</label>
                    <input name="location" required placeholder="e.g. Seef, Manama" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 block mb-1">Municipality No.</label>
                      <input name="municipalityNo" required placeholder="MUN-2026-XXXX" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 font-mono" />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Total Units</label>
                      <input name="totalUnits" type="number" required defaultValue="12" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsAddPropertyModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">Add Property</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: ADD NEW UNIT                                      */}
          {/* ======================================================== */}
          {isAddUnitModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-sm">Add Unit to Property</h3>
                  <button onClick={() => setIsAddUnitModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleAddUnit} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1">Select Property</label>
                    <select name="propId" required className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                      {properties.map(p => (
                        <option key={p.id} value={p.id}>{p.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 block mb-1">Unit Number / Code</label>
                      <input name="unitNumber" required placeholder="e.g. APT 402" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Floor</label>
                      <input name="floor" required placeholder="e.g. 4th Floor" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-slate-300 block mb-1">Monthly Rent (BHD)</label>
                      <input name="rentAmount" type="number" step="10" required placeholder="650" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 font-mono" />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Bedrooms</label>
                      <input name="bedrooms" type="number" required defaultValue="2" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Bathrooms</label>
                      <input name="bathrooms" type="number" required defaultValue="2" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 block mb-1">Unit Type</label>
                      <input name="unitType" required placeholder="Residential Apartment" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">EWA Account No.</label>
                      <input name="ewaAccountNo" required placeholder="EWA-9920102" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 font-mono" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-300 block mb-1">EWA Monthly Cap Limit (BHD)</label>
                    <input name="ewaCap" type="number" required defaultValue="80" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 font-mono" />
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsAddUnitModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">Save Unit</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: BHD OFFICIAL PAYMENT RECEIPT PREVIEW                */}
          {/* ======================================================== */}
          {isPaymentReceiptModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl font-sans">
                <div className="flex items-center justify-between border-b pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-900">Executive Facility Management</h3>
                    <p className="text-xs text-slate-500">Official Rental Receipt (Bahrain)</p>
                  </div>
                  <button onClick={() => setIsPaymentReceiptModalOpen(null)} className="text-slate-400 hover:text-slate-700">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div>
                      <span className="text-slate-500 block text-[10px]">Receipt No</span>
                      <span className="font-mono font-bold text-slate-800">{isPaymentReceiptModalOpen.receiptNo}</span>
                    </div>
                    <div className="text-right">
                      <span className="text-slate-500 block text-[10px]">Date</span>
                      <span className="font-medium text-slate-800">{isPaymentReceiptModalOpen.date}</span>
                    </div>
                  </div>

                  <div className="space-y-2 py-2">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Period Covered:</span>
                      <span className="font-semibold text-slate-800">{isPaymentReceiptModalOpen.period}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Payment Gateway:</span>
                      <span className="font-semibold text-slate-800">{isPaymentReceiptModalOpen.method}</span>
                    </div>
                    <div className="flex justify-between border-t pt-2 mt-2">
                      <span className="text-slate-700 font-bold">Total Settled:</span>
                      <span className="font-bold text-emerald-600 text-sm">{formatBHD(isPaymentReceiptModalOpen.amount)}</span>
                    </div>
                  </div>

                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-[11px] text-amber-800 flex items-center space-x-2">
                    <Icon name="ShieldCheck" className="w-4 h-4 text-amber-600 flex-shrink-0" />
                    <span>Digitally verified payment record issued in compliance with Kingdom of Bahrain Tenancy regulations.</span>
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-2 border-t">
                  <button
                    onClick={() => {
                      triggerToast(`Downloaded PDF receipt ${isPaymentReceiptModalOpen.receiptNo}`);
                      setIsPaymentReceiptModalOpen(null);
                    }}
                    className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-2 shadow"
                  >
                    <Icon name="Download" className="w-4 h-4" />
                    <span>Download Official Receipt PDF</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-950 border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>&copy; 2026 Executive Facility Management — Kingdom of Bahrain</span>
              <span className="font-mono text-[11px]">BHD Standard • CPR / CR / EWA Cap Automated Engine</span>
            </div>
          </footer>

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
